name: Update calendar feed

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:          # "Run workflow" button for an immediate update

permissions:
  contents: write

concurrency:
  group: calendar-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet icalendar recurring-ical-events

      - name: Build events.json
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
        run: python scripts/build_events.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- events.json)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "kitchen-screen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Update calendar feed"
          git push
