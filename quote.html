<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olivia says</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  /* Transparent page: laid over the bottom of the photo as a caption. */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  body{font-family:'Roboto',system-ui,sans-serif;color:#F4F9F8;box-sizing:border-box;
       display:flex;flex-direction:column;justify-content:flex-end;
       padding:0 6vw 11vh 6vw;border-radius:0 0 20px 20px;
       background:linear-gradient(to bottom, rgba(8,18,22,0) 0%, rgba(8,18,22,.55) 38%, rgba(8,18,22,.88) 100%);}
  .label{color:#EFA457;text-transform:uppercase;letter-spacing:.2em;font-size:11vh;line-height:1;margin-bottom:5vh;
         text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .q{font-weight:300;font-style:italic;line-height:1.22;text-shadow:0 1px 4px rgba(0,0,0,.7);}
  .q::before{content:"\201C";color:#EFA457;font-style:normal;margin-right:.06em;}
  .q::after{content:"\201D";color:#EFA457;font-style:normal;margin-left:.04em;}
  body.solid{background:#13242A;border-radius:20px;justify-content:center;padding:0 6vw;}
</style>
</head>
<body>
  <div class="label">Olivia says</div>
  <div class="q" id="q"></div>

<script src="quotes.js"></script>
<script>
// A new quote each day. Test: quote.html?date=2026-10-02  or  ?n=5  (quote number), ?solid for an opaque card
const params = new URLSearchParams(location.search);
if (params.has("solid")) document.body.classList.add("solid");
function today() {
  if (params.get("date")) { const [y,m,d] = params.get("date").split("-").map(Number); return new Date(y, m-1, d); }
  return new Date();
}
function render() {
  const list = OLIVIA_SAYS.quotes, t = today();
  const day = Math.floor(new Date(t.getFullYear(), t.getMonth(), t.getDate()) / 86400000);
  const i = params.get("n") ? Number(params.get("n")) % list.length : day % list.length;
  const q = document.getElementById("q");
  q.textContent = list[i].replace(/^"|"$/g, "");
  // Largest size that keeps the quote to the space above the label's bottom edge.
  const vh = innerHeight / 100, maxH = innerHeight * 0.62;
  let size = 20;
  do { q.style.fontSize = size * vh + "px"; size -= 0.5; }
  while (size > 7 && (q.scrollHeight > maxH || q.scrollWidth > q.clientWidth + 1));
}
document.fonts.ready.then(render);
render();
addEventListener("resize", render);
let lastDay = new Date().toDateString();
setInterval(() => { const d = new Date().toDateString(); if (d !== lastDay) { lastDay = d; render(); } }, 60 * 1000);
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
</script>
</body>
</html>
