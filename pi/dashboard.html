<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  /* Bay palette — dark, low-glare, one cool accent + one warm accent */
  :root{
    --page:#0E1A22; --panel:rgba(138,180,248,0.05); --panel-line:rgba(138,180,248,0.12);
    --cell:rgba(138,180,248,0.045); --ink:#E8EEF3; --muted:#93A7B5; --dim:#6F8494;
    --bay:#8AB4F8; --peach:#F2B98A; --peach-ink:#F7DCC4;
  }
  html,body{margin:0;height:100%;background:var(--page);overflow:hidden;cursor:none;}
  /* Everything is laid out on a fixed 1920x1080 canvas, then scaled to the screen. */
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
         font-family:Roboto,"Noto Sans",system-ui,sans-serif,"Noto Color Emoji";color:var(--ink);}
  .block{position:absolute;box-sizing:border-box;}
  .panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;overflow:hidden;}
  .label{color:var(--bay);text-transform:uppercase;letter-spacing:.18em;font-size:17px;font-weight:400;}

  /* clock */
  #clock{left:48px;top:32px;width:576px;height:108px;}
  #time{font-size:84px;font-weight:200;line-height:1;letter-spacing:-.01em;}
  #date{margin-top:10px;color:var(--bay);text-transform:uppercase;letter-spacing:.16em;font-size:21px;}

  /* weather */
  #weather{left:1094px;top:28px;width:778px;height:116px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px;}
  #wtop{display:flex;align-items:center;gap:28px;}
  #wnow{display:flex;flex-direction:column;justify-content:center;padding-right:28px;border-right:1px solid var(--panel-line);height:82px;}
  #wmain{display:flex;align-items:center;gap:14px;}
  #wtemp{font-size:78px;font-weight:200;line-height:1;}
  #wnow svg{width:64px;height:64px;}
  /* air quality + pollen: two small color-coded chips under the temperature */
  #weather.air #wtemp{font-size:70px;}
  #weather.air #wnow svg{width:54px;height:54px;}
  #weather.air .wday svg{width:34px;height:34px;margin:3px 0 2px;}
  #weather.air .wday .d{font-size:17px;} #weather.air .wday .t{font-size:19px;}
  #air{display:none;gap:8px;justify-content:flex-end;}
  #weather.air #air{display:flex;}
  .aq .why{color:var(--muted);font-size:13px;margin-left:2px;}
  .aq.rain{--c:#8AB4F8;} .aq.rain svg{width:14px;height:14px;color:var(--c);}
  .aq{--c:#81C995;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:7px;white-space:nowrap;
      background:color-mix(in srgb, var(--c) 16%, transparent);border:1px solid color-mix(in srgb, var(--c) 38%, transparent);}
  .aq i{width:8px;height:8px;border-radius:50%;background:var(--c);}
  .aq .k{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;}
  .aq b{color:var(--c);font-size:15px;font-weight:500;}
  .aq.l1{--c:#FDD663;} .aq.l2{--c:#FCAD70;} .aq.l3{--c:#F28B82;} .aq.l4{--c:#C58AF9;} .aq.l5{--c:#E8708A;}
  #wdays{display:flex;gap:10px;}
  .wday{width:88px;text-align:center;}
  .wday .d{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:19px;}
  .wday svg{width:40px;height:40px;margin:6px 0 4px;}
  .wday .t{font-size:20px;}
  .wday .t b{font-weight:400;} .wday .t span{color:var(--dim);margin-left:8px;}

  /* calendar */
  #cal{left:48px;top:162px;width:1190px;height:886px;padding:14px 16px 16px;display:grid;
       grid-template-columns:repeat(7,1fr);grid-template-rows:34px repeat(5,1fr);gap:8px;}
  .dow{color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-size:18px;align-self:end;padding-left:6px;}
  .dow.today{color:var(--bay);font-weight:500;}
  .day{background:var(--cell);border-radius:10px;padding:8px 9px 0;overflow:hidden;min-width:0;}
  .day.past{opacity:.38;}
  /* multi-day all-day events (school week, trips): one bar across the days instead of a copy in each */
  .bar{align-self:start;z-index:1;height:24px;line-height:24px;font-size:16px;margin:0 6px;padding:0 9px;box-sizing:border-box;
       border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
       background:rgba(242,185,138,0.16);border-left:3px solid var(--peach);color:var(--peach-ink);}
  .bar.tinted{background:color-mix(in srgb, var(--c) 24%, transparent);border-left-color:var(--c);color:var(--ink);}
  .bar.cont{border-left:0;border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-4px;}
  .bar.more{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-4px;}
  .bar.past{opacity:.38;}
  .lanes{flex:none;}
  .day.today{background:rgba(138,180,248,0.14);outline:1.5px solid rgba(138,180,248,0.55);}
  .num{font-size:24px;font-weight:200;line-height:1.1;margin-bottom:2px;}
  .day.today .num{color:var(--bay);font-weight:400;}
  /* Event text starts at 19px with the whole title showing; busy days shrink it (--fs) until every
     event fits. Titles are only cut ("…") as a last resort, below 12px. */
  .ev{font-size:var(--fs,19px);line-height:1.16;margin-top:5px;width:100%;box-sizing:border-box;display:-webkit-box;-webkit-line-clamp:var(--lines,none);-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
  .day.dense .ev{margin-top:3px;}
  .day.dense .num{font-size:20px;}
  .ev .tm{color:var(--bay);}
  /* Events coloured in Google Calendar: a stripe and soft tint of that colour, text kept light for reading. */
  .ev.tinted{border-left:3px solid var(--c);background:color-mix(in srgb, var(--c) 24%, transparent);
             border-radius:4px;padding:2px 6px;margin-left:-3px;margin-right:-3px;}
  .day.dense .ev.tinted,.day.dense .ev.allday{padding:1px 5px;}
  .ev.tinted .tm{color:color-mix(in srgb, var(--c) 45%, white);}
  .ev.allday{background:rgba(242,185,138,0.16);border-left:3px solid var(--peach);color:var(--peach-ink);
             border-radius:4px;padding:2px 6px;margin-left:-3px;margin-right:-3px;}

  /* family list */
  #todo{left:1277px;top:162px;width:595px;height:248px;padding:18px 22px;}
  #todo .label{padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid rgba(138,180,248,0.14);}
  #tasks{column-count:2;column-gap:24px;font-size:18px;}
  #tasks div{break-inside:avoid;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start;line-height:1.2;}
  #tasks div::before{content:"";flex:0 0 14px;height:14px;margin-top:3px;border:1.5px solid var(--dim);border-radius:3px;}
  #tasks .empty{color:var(--dim);}
  #tasks .empty::before{display:none;}

  /* photo */
  #photo{left:1277px;top:432px;width:595px;height:356px;}
  .ph{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;}
  .ph.on{opacity:1;}
  .ph .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(24px) brightness(.55);}
  .ph .fg{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat;}
  .ph .cap{position:absolute;right:12px;top:10px;padding:3px 10px;border-radius:12px;font-size:14px;color:#fff;
           background:rgba(0,0,0,.38);opacity:.92;}   /* top corner: the quote covers the bottom of the panel */
  .ph .cap:empty{display:none;}
  #quote{position:absolute;left:0;bottom:0;width:100%;height:162px;border:0;background:transparent;}

  /* word of the day */
  #word{left:1277px;top:810px;width:595px;height:238px;}
  #word iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

  /* top-center banner: severe weather first, then an urgent "leave by", then the weekday-morning commute */
  #banner{left:520px;top:34px;width:540px;height:104px;display:none;align-items:center;gap:20px;
          padding:0 26px;border-radius:18px;border:1px solid var(--panel-line);background:var(--panel);}
  #banner.show{display:flex;}
  /* countdown (Halloween, birthdays, trips): fills the banner spot quietly when nothing else is there */
  #banner.count{border-color:transparent;background:transparent;justify-content:center;gap:18px;}
  #banner.count svg{flex:0 0 44px;height:44px;}
  #banner.count .txt{flex:0 1 auto;}
  #banner.count .lbl{color:var(--muted);font-size:16px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #banner.count .big{font-size:34px;}
  #banner.count .big.note{font-size:30px;}
  #banner svg{flex:0 0 46px;height:46px;color:var(--ic,var(--bay));}
  #banner .txt{min-width:0;flex:1;}
  #banner .small{color:var(--muted);font-size:19px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #banner .big{font-size:36px;font-weight:300;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #banner .big b{font-weight:400;color:var(--bay);}
  #banner.soon{border-color:rgba(242,185,138,.6);background:rgba(242,185,138,.10);}
  #banner.soon .big b{color:var(--peach);}
  #banner.now{border-color:var(--peach);background:rgba(242,185,138,.2);}
  #banner.now .big b{color:var(--peach);}
  #banner.watch{border-color:rgba(242,185,138,.7);background:rgba(242,185,138,.12);}
  #banner.watch .big{color:var(--peach-ink);text-transform:uppercase;letter-spacing:.04em;font-size:30px;font-weight:400;}
  #banner.warning{border-color:#F28B82;background:rgba(242,139,130,.22);animation:pulse 2.4s ease-in-out infinite;}
  #banner.warning .big{color:#FFDAD6;text-transform:uppercase;letter-spacing:.04em;font-size:30px;font-weight:500;}
  @keyframes pulse{50%{background:rgba(242,139,130,.36);}}
  /* weekday-morning commute strip (same spot as the banner) */
  #banner.commute{gap:16px;padding:0 20px;}
  #banner .cm{flex:1;min-width:0;text-align:center;}
  #banner .cm + .cm{border-left:1px solid var(--panel-line);}
  #banner .cm .n{color:var(--muted);font-size:15px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #banner .cm .n.long{font-size:12px;letter-spacing:.08em;line-height:1.15;white-space:normal;}   /* "Andrews Elementary" wraps */
  #banner .cm .m{font-size:34px;font-weight:300;line-height:1.1;color:var(--ink);}
  #banner .cm .m small{font-size:17px;color:var(--muted);margin-left:3px;}
  #banner .cm .d{font-size:15px;color:var(--dim);white-space:nowrap;}
  #banner .cm.slow .m{color:var(--peach);}  #banner .cm.slow .d{color:var(--peach);}
  #banner .cm.bad .m{color:#F28B82;}        #banner .cm.bad .d{color:#F28B82;}
  #banner .cm.off .m{font-size:22px;color:var(--dim);padding:6px 0 5px;}
  /* morning trip with a leave-by time (drop-off on the way to work) */
  #banner .cm.trip{flex:2.8;}
  #banner .cm.trip .d{overflow:hidden;}
  #banner .cm.trip .m{font-size:32px;white-space:nowrap;}
  #banner .cm.trip .m b{font-weight:400;color:var(--bay);}
  #banner .cm.trip .d{color:var(--muted);font-size:16px;}
  #banner .cm.trip .d .late{color:var(--peach);}
  #banner .cm.trip.soon .m b{color:var(--peach);}
  #banner .cm.trip.now .m b{color:var(--peach);font-weight:500;}
  #banner .cm.trip.bad .m b, #banner .cm.trip .d .bad{color:#F28B82;}
  /* two people: one row each */
  #banner.rows{padding:0 18px 0 20px;gap:14px;}
  #banner .trows{flex:1;min-width:0;display:flex;flex-direction:column;}
  #banner .tr{display:flex;align-items:center;gap:12px;height:48px;}
  #banner .tr + .tr{border-top:1px solid var(--panel-line);}
  #banner .tr .who{flex:0 0 78px;color:var(--muted);font-size:14px;letter-spacing:.12em;text-transform:uppercase;line-height:1.1;}
  #banner .tr .who small{display:block;font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--peach);}
  #banner .tr .m{flex:0 0 auto;max-width:165px;font-size:27px;font-weight:300;white-space:nowrap;overflow:hidden;color:var(--ink);}
  #banner .tr .m b{font-weight:400;color:var(--bay);}
  #banner .tr.soon .m b, #banner .tr.now .m b{color:var(--peach);}
  #banner .tr.bad .m b, #banner .tr .d .bad{color:#F28B82;}
  #banner .tr .d{flex:1;min-width:0;font-size:14px;line-height:1.15;color:var(--muted);white-space:nowrap;overflow:hidden;}
  #banner .tr .d .late{color:var(--peach);}
  #banner .tr .d .now{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase;line-height:1.3;}
  #banner .cm.trip .d .now{color:var(--dim);font-size:.9em;}
  #banner .tr .d .good, #banner .cm.trip .d .good{color:#81C995;}
  #banner .tr.off .m{font-size:22px;color:var(--dim);}
  #banner.commute.soon{border-color:rgba(242,185,138,.6);background:rgba(242,185,138,.10);}
  #banner.commute.now{border-color:var(--peach);background:rgba(242,185,138,.2);}

  /* night mode (21:30-06:00): a dim, nearly black page — clock, tomorrow's first events, weather alerts */
  #night{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#3E5260;}
  #stage.night{background:#05090C;}
  body:has(#stage.night){background:#05090C;}
  #stage.night > :not(#night){display:none !important;}
  #stage.night #night{display:flex;}
  #ntime{font-size:220px;font-weight:100;line-height:1;letter-spacing:-.02em;color:#4A606F;}
  #ndate{font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:#34474F;}
  #ntom{margin-top:44px;text-align:center;font-size:28px;line-height:1.5;color:#3E5260;}
  #ntom .h{font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#2E3F48;margin-bottom:6px;}
  #ntom .tm{color:#4F6878;}
  #nalert{margin-top:24px;font-size:26px;color:#9E5A55;letter-spacing:.06em;text-transform:uppercase;}
  #status{position:absolute;right:52px;bottom:8px;font-size:13px;color:var(--dim);opacity:.7;}
</style>
</head>
<body>
<div id="stage">
  <div class="block" id="clock"><div id="time"></div><div id="date"></div></div>
  <div class="block" id="banner"></div>
  <div class="block" id="weather"><div id="wtop"><div id="wnow"><div id="wmain"></div></div><div id="wdays"></div></div><div id="air"></div></div>
  <div class="block panel" id="cal"></div>
  <div class="block panel" id="todo"><div class="label" id="todoTitle">Family list</div><div id="tasks"></div></div>
  <div class="block panel" id="photo">
    <div class="ph" id="phA"><div class="bg"></div><div class="fg"></div><div class="cap"></div></div>
    <div class="ph" id="phB"><div class="bg"></div><div class="fg"></div><div class="cap"></div></div>
    <iframe id="quote" src="../quote.html" allowtransparency="true"></iframe>
  </div>
  <div class="block panel" id="word"><iframe src="../card.html"></iframe></div>
  <div id="status"></div>
  <div id="night"><div id="ntime"></div><div id="ndate"></div><div id="ntom"></div><div id="nalert"></div></div>
</div>

<script>
// ── settings ──
const LAT = 33.0198, LNG = -96.6989;      // Plano, TX
const WEEKS = 5;
let photoSeconds = 20;                       // server sends "photo_seconds" from config.json
const DATA = "/data/";                       // written by server.py on the Pi

// Test hook: dashboard.html?date=2026-10-08
const params = new URLSearchParams(location.search);
const now = () => {
  const t = new Date();
  if (params.get("time")) { const [h, mi] = params.get("time").split(":").map(Number); t.setHours(h, mi); }
  if (params.get("date")) { const [y,m,d] = params.get("date").split("-").map(Number); return new Date(y, m-1, d, t.getHours(), t.getMinutes()); }
  return t;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
async function getJSON(url) { const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }

// ── fit the 1920x1080 canvas to whatever screen this is ──
function fitStage() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  const st = document.getElementById("stage");
  st.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener("resize", fitStage); fitStage();

// ── clock ──
// Night: 21:30-06:00 the screen goes dim and quiet. "?night=0" turns it off for testing.
const NIGHT = ["21:30", "06:00"];
function isNight(d) {
  if (params.get("night") === "0") return false;
  const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  return hm >= NIGHT[0] || hm < NIGHT[1];
}
function renderNight(d) {
  document.getElementById("ntime").textContent = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M$/, "");
  document.getElementById("ndate").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  // "Tomorrow" after midnight's evening, "Today" in the small hours
  const day = new Date(d); if (d.getHours() >= 12) day.setDate(day.getDate() + 1);
  const key = ymd(day);
  const list = events.filter(ev => !ev.hidden && !(ev.allDay && NOTE_TITLE.test(ev.title)) && !(!ev.allDay && ev.free && !ev.location))
    .filter(ev => ev.allDay ? ev.start <= key && key < (ev.end || ev.start) || ev.start === key : ymd(new Date(ev.start)) === key)
    .sort((a, b) => (a.allDay ? 0 : new Date(a.start)) - (b.allDay ? 0 : new Date(b.start))).slice(0, 3);
  const w = wx && wx.daily ? wx.daily.time.indexOf(key) : -1;
  const temps = w >= 0 ? ` · ${Math.round(wx.daily.temperature_2m_max[w])}° / ${Math.round(wx.daily.temperature_2m_min[w])}°` : "";
  const label = (d.getHours() >= 12 ? "Tomorrow" : "Today") + temps;
  document.getElementById("ntom").innerHTML = `<div class="h">${label}</div>` + (list.length
    ? list.map(ev => `<div>${ev.allDay ? "" : `<span class="tm">${fmtTime(new Date(ev.start))}</span> `}${esc(shortTitle(ev.title))}</div>`).join("")
    : `<div>Nothing on the calendar</div>`);
  document.getElementById("nalert").textContent = alerts[0] ? alerts[0].event : "";
}
function renderClock() {
  const d = now();
  const night = isNight(d);
  document.getElementById("stage").classList.toggle("night", night);
  if (night) renderNight(d);
  else if (needFit) fitCalendar();                 // calendar changed while it was hidden for the night
  document.getElementById("time").textContent = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M$/, "");
  document.getElementById("date").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}

// ── weather (Open-Meteo, no account needed) ──
const COUNT_ICON = {   // line icons for the countdown, same style as the rest of the screen
  pumpkin: ["#F2B98A", '<path d="M12 8.3c-2.4-1.2-6.6-.9-8.3 1.6-1.6 2.5-1.3 6.6.6 8.5 1.9 1.9 5.4 1.9 7.7.8 2.3 1.1 5.8 1.1 7.7-.8 1.9-1.9 2.2-6 .6-8.5-1.7-2.5-5.9-2.8-8.3-1.6z"/><path d="M8.6 8.4c-1.7 3-1.7 8.1.2 11M15.4 8.4c1.7 3 1.7 8.1-.2 11M12 8.3V5.4c0-.8.4-1.4 1.3-1.9"/>'],
  leaf: ["#FCAD70", '<path d="M5 19c0-8.5 5-13.2 14-14 0 9-5 14-14 14z"/><path d="M5 19l8.5-8.5"/>'],
  tree: ["#81C995", '<path d="M12 3l4.2 5.2h-2.6l3.6 5h-2.6l3.4 4.8H6l3.4-4.8H6.8l3.6-5H7.8z"/><path d="M12 18v3"/>'],
  lantern: ["#F28B82", '<ellipse cx="12" cy="12" rx="6" ry="7.2"/><path d="M12 2.5v2.3M9 4.8h6M9 19.2h6M12 19.2V22M12 4.8c-2.6 2-2.6 12.4 0 14.4M12 4.8c2.6 2 2.6 12.4 0 14.4"/>'],
  heart: ["#F28B82", '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'],

const tint = ev => /^#[0-9A-Fa-f]{6}$/.test(ev.color || "") ? ` style="--c:${ev.color}"` : "";
function renderCalendar() {

  const byDay = {}, spans = [];
  for (const ev of events) {

    if (ev.allDay && NOTE_TITLE.test(ev.title)) continue;   // "Pre-K this week: ..." shows as an evening note instead
    if (!ev.allDay && ev.free && !ev.location) continue;   // phone nudges (timed, "Free", no place): not for the wall
    if (ev.allDay) {
      // all-day events cover [start, end) by date
      const s = new Date(ev.start + "T00:00"), e = new Date((ev.end || ev.start) + "T00:00");
      if (e <= s) e.setDate(s.getDate() + 1);
      if (Math.round((e - s) / 864e5) >= 2) { spans.push({ ev, s, e }); continue; }   // drawn as one bar
      for (const d = new Date(s); d < e; d.setDate(d.getDate() + 1)) (byDay[ymd(d)] ||= []).push({ ...ev, sort: -1 });
    } else {
      const s = new Date(ev.start);

    }
  }
  // Multi-day bars: one segment per week row, stacked in lanes; each day they cross keeps room for them.
  const LANE = 28, DAY = 864e5, segs = [], laneEnds = {}, cellLanes = {};
  for (const sp of spans.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s))) {
    for (let r = 0; r < WEEKS; r++) {
      const rs = new Date(start); rs.setDate(start.getDate() + 7 * r);
      const re = new Date(rs); re.setDate(rs.getDate() + 7);
      const s = sp.s > rs ? sp.s : rs, e = sp.e < re ? sp.e : re;
      if (s >= e) continue;
      const c0 = Math.round((s - rs) / DAY), c1 = Math.round((e - rs) / DAY);
      const ends = laneEnds[r] ||= [];
      let lane = ends.findIndex(x => x <= c0);
      if (lane < 0) { lane = ends.length; ends.push(0); }
      ends[lane] = c1;
      for (let c = c0; c < c1; c++) cellLanes[r * 7 + c] = Math.max(cellLanes[r * 7 + c] || 0, lane + 1);

  for (let i = 0; i < WEEKS * 7; i++) {

    ` style="grid-row:${g.r + 2};grid-column:${g.c0 + 1}/${g.c1 + 1};margin-top:${38 + g.lane * LANE}px;${g.ev.color && /^#[0-9A-Fa-f]{6}$/.test(g.ev.color) ? `--c:${g.ev.color};` : ""}">` +
    `${esc(shortTitle(g.ev.title))}</div>`).join("");

// Measuring only works while the calendar is on screen: at night it is display:none and every cell
// measures 0px, so the fit waits (needFit) and runs when the day page comes back.
let needFit = false;
function fitCalendar() {
  const cal = document.getElementById("cal");
  if (!cal.offsetParent || cal.clientHeight === 0) { needFit = true; return; }
  needFit = false;
  const STEPS = [];
  for (let fs = 19; fs >= 11; fs--) STEPS.push(["none", fs]);
  STEPS.push([2, 11], [1, 11], [1, 10]);
  cal.querySelectorAll(".day").forEach(cell => {
    if (!cell.querySelector(".ev")) return;
    const over = () => cell.scrollHeight > cell.clientHeight + 1;
    for (const [lines, fs] of STEPS) {
      cell.style.setProperty("--lines", lines);
      cell.style.setProperty("--fs", fs + "px");
      cell.classList.toggle("dense", fs <= 14);

    }

}

// "Leave 7:42 · Pre-K 7:50 · SHQ 8:28": leaving later than the leave time pushes the arrivals out.
function tripCard(m, now) {
  if (m.off) return { state: "", html: `<div class="cm off"><div class="n">${esc(m.name)}</div><div class="m">No school</div><div class="d">&nbsp;</div></div>`,
                      row: `<div class="tr off"><div class="who">${esc(m.name)}</div><div class="m">No school</div><div class="d"></div></div>` };
  const clock = d => d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M$/, "");
  const leave = new Date(m.leave), by = m.by ? new Date(m.by) : null;
  const mins = Math.ceil((leave - now) / 60000);
  // Arrival times are "if you leave right now", with the current traffic.
  const legs = m.now_legs || m.legs;
  const atVia = m.via ? new Date(+now + legs[0] * 60000) : null;
  const atTo = new Date(+now + (legs.reduce((a, x) => a + x, 0) + (m.stop_min || 0)) * 60000);
  const inWindow = m.aim && atTo >= new Date(m.aim) && atTo <= by;     // e.g. 8:30-8:45 at work
  const viaLate = atVia && m.via_by && atVia > new Date(m.via_by);
  const late = by ? atTo > by : !!viaLate;                    // work-from-home day: only drop-off time counts
  let state = "", big;
  if (mins > 15) big = `Leave <b>${clock(leave)}</b>`;
  else if (mins > 0) { state = "soon"; big = `Leave in <b>${mins} min</b>`; }
  else if (!late) { state = "now"; big = `<b>Leave now</b>`; }
  else { state = "now"; big = `<b>Running late</b>`; }
  const who = [m.name, m.live && m.delay >= 4 ? `+${m.delay} min traffic` : m.live ? "live traffic" : ""].filter(Boolean).join(" · ");
  const parts = [];
  if (m.via) parts.push(`<span class="${viaLate ? "late" : ""}">${esc(m.via)} ${clock(atVia)}</span>`);
  parts.push(`<span class="${by && late ? "bad" : inWindow ? "good" : ""}">${esc(m.to)} ${clock(atTo)}</span>`);
  const tag = m.live && m.delay >= 4 ? `+${m.delay} traffic` : "";
  return { state: late && mins <= 0 ? "now" : state,
           row: `<div class="tr ${state}${late ? " bad" : ""}"><div class="who">${esc(m.name)}${tag ? `<small>${tag}</small>` : ""}</div>` +
                `<div class="m">${big}</div><div class="d"><div class="now">If you leave now</div>${parts.join("<br>")}</div></div>`,

                 `<div class="m">${big}</div><div class="d"><span class="now">Leave now →</span> ${parts.join(" · ")}</div></div>` };
}

    b.className = "block show " + a.level;
    b.style.setProperty("--ic", a.level === "warning" ? "#F28B82" : "var(--peach)");
    b.innerHTML = `${WARN}<div class="txt"><div class="big">${esc(a.event)}</div><div class="small">${esc(until)}${alerts.length > 1 ? ` · +${alerts.length - 1} more` : ""}</div></div>`;
    const big = b.querySelector(".big");            // long names ("Severe Thunderstorm Warning") shrink to fit
    for (let fs = 30; fs > 18 && big.scrollWidth > big.clientWidth; fs--) big.style.fontSize = fs + "px";
    return;
  }
  const t = new Date();
  const mts = commute.show ? (commute.trips || (commute.trip ? [commute.trip] : [])) : [];
  const covered = new Set(mts.flatMap(m => m.covers || []));  // e.g. "Pre-K Dropoff": the trip card covers it
  const trip = trips.find(x => new Date(x.start) > t && !covered.has(x.title));
  const tripMins = trip ? Math.round((new Date(trip.leave) - t) / 60000) : Infinity;
  // On the way home (from the phone's location), unless a "leave" is due within 15 minutes.
  if (eta.show && tripMins > 15) {
    const short = d => d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M$/, "");
    const at = new Date(eta.eta), left = Math.round((at - t) / 60000);
    const big = left <= 2 ? "<b>Almost home</b>" : `Home <b>~${short(at)}</b>`;
    const away = left > 2 ? `${left} min away` : "pulling in";
    const traffic = eta.live && eta.delay >= 4 ? ` · +${eta.delay} traffic` : "";
    b.className = "block show";
    b.style.setProperty("--ic", "var(--bay)");
    b.innerHTML = `${CAR}<div class="txt"><div class="small">${esc(eta.name)} · left work ${short(new Date(eta.left))}</div>` +
      `<div class="big">${big}</div><div class="small">${away}${traffic}</div></div>`;
    return;
  }
  // Weekday mornings: drive times to the usual places, unless a "leave" is due within 15 minutes.
  if (commute.show && ((commute.routes || []).length || mts.length) && tripMins > 15) {
    const tcs = mts.map(m => tripCard(m, t));
    const state = tcs.some(c => c.state === "now") ? "now" : tcs.some(c => c.state === "soon") ? "soon" : "";
    const rows = tcs.length > 1;                                // two people: one row each
    b.className = "block show commute" + (rows ? " rows" : "") + (state ? " " + state : "");
    b.style.setProperty("--ic", state ? "var(--peach)" : "var(--bay)");
    b.innerHTML = CAR + (rows ? `<div class="trows">${tcs.map(c => c.row).join("")}</div>` : tcs.map(c => c.html).join("")) + (commute.routes || []).map(r => {
      if (r.off) return `<div class="cm off"><div class="n${r.name.length > 9 ? " long" : ""}">${esc(r.name)}</div><div class="m">No school</div><div class="d">&nbsp;</div></div>`;
      if (r.minutes == null) return `<div class="cm"><div class="n">${esc(r.name)}</div><div class="m">–</div><div class="d">&nbsp;</div></div>`;
      const cls = !r.live ? "" : r.delay >= 10 ? " bad" : r.delay >= 4 ? " slow" : "";
      const d = !r.live ? "usual time" : r.delay >= 1 ? `+${r.delay} traffic` : "clear";
      return `<div class="cm${cls}"><div class="n${r.name.length > 9 ? " long" : ""}">${esc(r.name)}</div><div class="m">${r.minutes}<small>min</small></div><div class="d">${d}</div></div>`;
    }).join("");
    for (const el of b.querySelectorAll(".cm.trip .n, .cm.trip .d, .cm.trip .m, .tr .d, .tr .m")) {   // long names shrink to fit
      for (let fs = parseFloat(getComputedStyle(el).fontSize); fs > 11 && el.scrollWidth > el.clientWidth; fs--) el.style.fontSize = fs + "px";
    }
    return;
  }
  if (!trip) { renderCountdown(b); return; }
  const leave = new Date(trip.leave), mins = tripMins;
  const state = mins <= 0 ? "now" : mins <= 15 ? "soon" : "";
  const big = mins <= 0 ? "<b>Leave now</b>" : mins <= 15 ? `Leave in <b>${mins} min</b>` : `Leave by <b>${clock(leave)}</b>`;
  b.className = "block show " + state;
  b.style.setProperty("--ic", state ? "var(--peach)" : "var(--bay)");
  b.innerHTML = `${CAR}<div class="txt"><div class="small">${esc(trip.title)} · ${clock(new Date(trip.start))}</div>` +
    `<div class="big">${big}</div><div class="small">${trip.minutes} min drive${trip.traffic ? " with traffic" : ""}</div></div>`;
}
async function loadBanner() {
  try { alerts = (await getJSON(DATA + "alerts.json")).alerts || []; } catch (e) { alerts = []; }
  try { trips = (await getJSON(DATA + "leave.json")).trips || []; } catch (e) { trips = []; }
  try { commute = await getJSON(DATA + "commute.json"); setStatus("commute", commute.error); } catch (e) { commute = { show: false }; }
  try { eta = await getJSON(DATA + "eta.json"); } catch (e) { eta = { show: false }; }
  try { count = await getJSON(DATA + "countdown.json"); } catch (e) { count = { show: false }; }
  try { note = await getJSON(DATA + "note.json"); } catch (e) { note = { show: false }; }
  try { setStatus("words", (await getJSON(DATA + "word.json")).warning); } catch (e) { /* not picked yet */ }
  renderBanner();
}

// ── schedule ──
renderClock(); setInterval(renderClock, 5000);
if (document.fonts) document.fonts.ready.then(fitCalendar);   // web fonts can land after the first fit
loadBanner(); setInterval(loadBanner, 20 * 1000); setInterval(renderBanner, 15 * 1000);
loadWeather(); setInterval(loadWeather, 60 * 1000);
loadAir(); setInterval(loadAir, 5 * 60 * 1000);
loadCalendar(); setInterval(loadCalendar, 15 * 1000);
loadTasks(); setInterval(loadTasks, 10 * 1000);
loadPhotos(); setInterval(loadPhotos, 5 * 60 * 1000); (function photoTick() { nextPhoto(); setTimeout(photoTick, photoSeconds * 1000); })();
let lastDay = ymd(new Date());
setInterval(() => { if (ymd(new Date()) !== lastDay) { lastDay = ymd(new Date()); renderCalendar(); } }, 60 * 1000);
setTimeout(() => location.reload(), 12 * 60 * 60 * 1000);   // pick up new code twice a day
</script>
