<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdowns</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0C1B21; --ink:#EAF1F0; --muted:#8FAAB0; --amber:#EFA457; --rule:rgba(160,205,210,0.18); }
  html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);overflow:hidden;}
  body{font-family:'Roboto',system-ui,sans-serif;color:var(--ink);box-sizing:border-box;
       display:flex;flex-direction:column;justify-content:center;gap:9vh;padding:6vh 2vw;}
  .counts{display:flex;align-items:stretch;gap:3vw;min-width:0;}
  .count{display:flex;align-items:baseline;gap:1.4vw;min-width:0;}
  .count + .count{padding-left:3vw;border-left:1px solid var(--rule);}
  .num{color:var(--amber);font-weight:200;font-size:30vh;line-height:.9;}
  .what{display:flex;flex-direction:column;min-width:0;}
  .unit{color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-size:9vh;line-height:1.2;}
  .title{font-weight:300;font-size:14vh;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sky{display:flex;align-items:center;gap:2.4vw;color:var(--muted);font-size:12vh;white-space:nowrap;}
  .sky b{color:var(--ink);font-weight:300;}
  .sky svg{height:15vh;width:15vh;vertical-align:middle;margin-right:.8vw;}
  .item{display:flex;align-items:center;}
</style>
</head>
<body>
  <div class="counts" id="counts"></div>
  <div class="sky">
    <span class="item"><svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M-10 4 H10" stroke="#8FAAB0" stroke-width="1.6" stroke-linecap="round"/><path d="M-6 4 A6 6 0 0 1 6 4" fill="none" stroke="#EFA457" stroke-width="1.8"/><path d="M0 -9 V-6 M-7 -5 L-5 -3 M7 -5 L5 -3" stroke="#EFA457" stroke-width="1.6" stroke-linecap="round"/></svg>Sunset&nbsp;<b id="sunset"></b></span>
    <span class="item"><svg viewBox="-12 -12 24 24" id="moon" aria-hidden="true"></svg><b id="moonname"></b></span>
  </div>

<script>
const LAT = 33.0198, LNG = -96.6989;   // Plano, TX
const EVENTS_URL = "https://raw.githubusercontent.com/spencerapopp/kitchen_screen/main/events.json";
const params = new URLSearchParams(location.search);
const now = () => {
  if (params.get("date")) { const [y,m,d] = params.get("date").split("-").map(Number); return new Date(y, m-1, d, 12); }
  return new Date();
};
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const ymd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const nth = (y, month, weekday, n) => { const f = new Date(y, month, 1).getDay(); return new Date(y, month, 1 + ((weekday - f + 7) % 7) + (n - 1) * 7); };

// Holidays that are always counted down to (calendar events are added on top).
function holidays(year) {
  const list = [];
  for (const y of [year, year + 1]) {
    list.push({ title: "Valentine's Day", date: new Date(y, 1, 14) });
    list.push({ title: "Fourth of July", date: new Date(y, 6, 4) });
    list.push({ title: "Halloween", date: new Date(y, 9, 31) });
    list.push({ title: "Thanksgiving", date: nth(y, 10, 4, 4) });
    list.push({ title: "Christmas", date: new Date(y, 11, 25) });
    list.push({ title: "New Year's Day", date: new Date(y + 1, 0, 1) });
  }
  ["2027-02-06","2028-01-26","2029-02-13","2030-02-03","2031-01-23"].forEach(s => list.push({ title: "Lunar New Year", date: ymd(s) }));
  ["2026-09-25","2027-09-15","2028-10-03","2029-09-22","2030-09-12","2031-10-01"].forEach(s => list.push({ title: "Mid-Autumn Festival", date: ymd(s) }));
  return list;
}

let calendarCounts = [];

function renderCounts() {
  const today = midnight(now());
  const seen = new Set();
  const all = [...calendarCounts.map(c => ({ title: c.title, date: ymd(c.date), mine: true })), ...holidays(today.getFullYear())]
    .map(c => ({ ...c, days: Math.round((midnight(c.date) - today) / 86400000) }))
    .filter(c => c.days >= 0 && c.days <= 120)
    .sort((a, b) => a.days - b.days || (b.mine ? 1 : 0) - (a.mine ? 1 : 0))
    .filter(c => { const k = c.title + c.days; if (seen.has(k)) return false; seen.add(k); return true; });
  const show = all.slice(0, 2);
  document.getElementById("counts").innerHTML = show.map(c => {
    const num = c.days === 0 ? "" : c.days;
    const unit = c.days === 0 ? "Today" : c.days === 1 ? "day until" : "days until";
    return `<div class="count">${num === "" ? "" : `<span class="num">${num}</span>`}
      <span class="what"><span class="unit">${unit}</span><span class="title"></span></span></div>`;
  }).join("");
  document.querySelectorAll(".title").forEach((el, i) => el.textContent = show[i].title);
}

// Sunset — standard sunrise equation (accurate to a minute or two).
function sunset(date) {
  const rad = Math.PI / 180;
  const noon = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  const jd = noon.getTime() / 86400000 + 2440587.5;
  const n = Math.round(jd - 2451545.0 + 0.0008);
  const Jstar = n - LNG / 360;
  const M = (357.5291 + 0.98560028 * Jstar) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const decl = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
  const cosW = (Math.sin(-0.833 * rad) - Math.sin(LAT * rad) * Math.sin(decl)) / (Math.cos(LAT * rad) * Math.cos(decl));
  const Jset = Jtransit + Math.acos(cosW) / rad / 360;
  return new Date((Jset - 2440587.5) * 86400000);
}

// Moon phase from the average lunar cycle.
function moon(date) {
  const syn = 29.530588853;
  const jd = date.getTime() / 86400000 + 2440587.5;
  const age = (((jd - 2451550.1) % syn) + syn) % syn;
  const names = [[1.85,"New moon"],[5.54,"Waxing crescent"],[9.23,"First quarter"],[12.92,"Waxing gibbous"],
                 [16.61,"Full moon"],[20.30,"Waning gibbous"],[23.99,"Last quarter"],[27.68,"Waning crescent"],[99,"New moon"]];
  const name = names.find(([a]) => age < a)[1];
  const k = Math.cos(2 * Math.PI * age / syn);          // 1 = new, -1 = full
  const r = 9, rx = Math.abs(k) * r, waxing = age < syn / 2;
  const s = waxing ? 1 : -1;
  const outer = `M0 ${-r} A${r} ${r} 0 0 ${waxing ? 1 : 0} 0 ${r}`;
  const sweep = waxing ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0);
  const lit = `${outer} A${rx} ${r} 0 0 ${sweep} 0 ${-r}Z`;
  const svg = `<circle r="${r}" fill="rgba(160,205,210,0.14)"/>` + (age < 1 || age > syn - 1 ? "" : `<path d="${lit}" fill="#EAF1F0"/>`);
  return { name, svg };
}

function renderSky() {
  const d = now();
  document.getElementById("sunset").textContent =
    sunset(d).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  const m = moon(new Date(d.getFullYear(), d.getMonth(), d.getDate(), 21));
  document.getElementById("moon").innerHTML = m.svg;
  document.getElementById("moonname").textContent = m.name;
}

async function loadEvents() {
  try {
    const r = await fetch(EVENTS_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) { const data = await r.json(); calendarCounts = data.countdowns || []; renderCounts(); }
  } catch (e) { /* no feed yet — holidays only */ }
}

function render() { renderCounts(); renderSky(); }
document.fonts.ready.then(render);
render();
loadEvents();
setInterval(loadEvents, 30 * 60 * 1000);
setInterval(render, 10 * 60 * 1000);
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
</script>
</body>
</html>
